# Render Blueprint — KANAKU backend on the FREE tier (no card required).
#
# One combined service: with RUN_WORKERS_IN_API unset, server.js runs the
# background jobs (outbox / AI / cleanup) in-process (backend/src/server.ts) —
# the app's designed single-machine mode. Render free web services sleep after
# 15 min idle (~50s cold start); an external 5-min uptime ping (see
# docs/runbooks/render-migration.md) keeps it awake and doubles as monitoring.
#
# Deploy: Render dashboard → New → Blueprint → select this repo.
# Secrets (sync: false) are entered once in the dashboard — values live in
# backend/.env (gitignored); never commit them here.
services:
  - type: web
    name: kanaku-api
    runtime: docker
    plan: free
    region: singapore            # matches Fly 'sin' + Supabase region
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .             # workspace root (root lockfile), same as fly.toml
    healthCheckPath: /health
    autoDeploy: true             # every push to main deploys (Render builds, not Actions)
    # Applies schema changes before the new version goes live.
    #
    # Previously nothing did: the Dockerfile copies prisma/ into the image but its
    # CMD is just `node dist/server.js`, so a release whose code expected a new
    # column failed at runtime on a user request instead of at deploy.
    #
    # scripts/deploy-migrate.mjs is safe in both states this project can be in —
    # it applies pending migrations and aborts the deploy if they fail, but exits
    # 0 with a loud warning on P3005 (a `db push`-managed database with no
    # migration history, which is what CI provisions). So enabling it cannot brick
    # a deploy; worst case it tells you migrations still aren't automated.
    preDeployCommand: npm run db:deploy
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"            # tells Render where the container listens
      # RUN_WORKERS_IN_API deliberately UNSET → combined API+worker mode.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        sync: false
      - key: SENDGRID_FROM_NAME
        sync: false
      # ── Server-side PIN gate ─────────────────────────────────────────────────────
      # Enforces the app PIN on the BACKEND: financial routers return
      # 403 PIN_VERIFICATION_REQUIRED until a recent POST /pin/verify.
      #
      # This key was previously absent from every environment, so `isPinGateEnabled()`
      # was false and the `pinGate` mounted across the financial routers evaluated to
      # a no-op — the PIN protected the UI only, and any valid access token could read
      # every financial endpoint directly. Coverage has since been extended to the
      # routers that were missing it (groups, friends, bills, receipts, import,
      # payments, aa) and the client now handles the unlock/gate timing window, so
      # this is ready to switch on.
      #
      # The unlock is carried by a short-lived signed token (security/pinUnlock.ts),
      # not a server-side marker, so it needs no Redis, survives this free plan's
      # idle spin-down, and stays correct if the service ever runs >1 instance.
      # Requires SECURITY_JWT_SECRET (or JWT_SECRET) to be set — startup aborts in
      # production otherwise rather than signing with a per-boot random key that
      # would re-lock everyone on each container cycle.
      - key: PIN_GATE_ENABLED
        value: "true"
      - key: PIN_GATE_TIMEOUT_MINUTES
        value: "5"
      # ── Observability (Grafana Cloud) ────────────────────────────────────────────
      # Generate tokens locally: openssl rand -hex 32
      # Then add them as secrets in this dashboard (sync: false = enter value here).
      - key: METRICS_TOKEN
        sync: false     # Bearer token guarding GET /metrics — share with Grafana Agent
      - key: RENDER_DRAIN_TOKEN
        sync: false     # Bearer token for POST /internal/logs/drain (Render log drain)
      # Grafana Cloud Loki credentials (from grafana.com → Connections → Loki → Sending data)
      - key: LOKI_PUSH_URL
        sync: false     # e.g. https://logs-prod-012.grafana.net
      - key: LOKI_USERNAME
        sync: false     # Numeric Loki user ID
      - key: LOKI_API_KEY
        sync: false     # Grafana Cloud API key (MetricsPublisher / logs:write role)
      # Copy any remaining prod values from backend/.env (SECURITY_ALERT_EMAIL,
      # AA_ENCRYPTION_ROOT_KEY, FIREBASE_*, OPENAI/GOOGLE keys, …) in the
      # dashboard — the env.ts validator will fail fast on anything missing.
