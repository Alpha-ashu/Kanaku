name: Build iOS (Capacitor)

# Compiles the iOS app for physical devices (iphoneos) and exports an installable
# unsigned .ipa artifact that can be sideloaded onto an iPhone from Windows (via Sideloadly / AltStore)
# using a free Apple ID without requiring a Mac or paid Apple Developer account.

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "capacitor.config.*"
      - ".github/workflows/build-ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "capacitor.config.*"
      - ".github/workflows/build-ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'


# Least-privilege token. Without an explicit block a workflow inherits the
# repository default, which can be read/write on every scope — far more than a
# build job needs (CodeQL: "Workflow does not contain permissions").
permissions:
  contents: read

jobs:
  build:
    # Capacitor 8 uses Swift Package Manager; Xcode compilation runs on macOS runner.
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Pick the newest installed Xcode that actually has an iOS SDK.
      #
      # Pinning a specific app bundle (Xcode_16.2.app) selected a toolchain whose
      # iOS platform was not installed on the runner image, so xcodebuild failed
      # with 'iOS 18.2 is not installed'. Runner images change what they ship;
      # probing for a usable SDK is stable across those changes, and failing here
      # with the available list beats a destination error later.
      - name: Select Xcode
        run: |
          set -euo pipefail
          for app in $(ls -d /Applications/Xcode*.app 2>/dev/null | sort -Vr || true); do
            if DEVELOPER_DIR="$app/Contents/Developer" xcodebuild -showsdks 2>/dev/null | grep -qi "iphoneos"; then
              echo "Selected $app"
              sudo xcode-select -s "$app"
              xcodebuild -version
              exit 0
            fi
            echo "Skipping $app (no iOS SDK)"
          done
          echo "::error::No installed Xcode provides an iOS SDK on this runner."
          ls -d /Applications/Xcode*.app || true
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Swift Package Manager
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('ios/App/CapApp-SPM/Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build frontend for Capacitor (iOS Mode)
        run: npm run build:ios
        working-directory: frontend

      # Use the project's own script, not bare `npx cap sync ios`: it chains
      # cap:fix:spm (scripts/normalize-spm-paths.mjs), which rewrites the local
      # package paths in CapApp-SPM/Package.swift to forward slashes.
      #
      # `cap sync` writes NATIVE path separators, so a developer who syncs on
      # Windows produces paths joined with \ instead of /. Swift Package
      # Manager cannot resolve those on macOS: xcodebuild fails during dependency
      # resolution and surfaces a bare exit 70 rather than a readable error. CI
      # syncs on macOS so it regenerates them correctly, but a committed
      # Windows-synced manifest would poison the build.
      - name: Run Capacitor sync
        run: npm run cap:sync:ios

      # Fail with a readable message rather than an opaque resolution error if a
      # Windows-synced manifest ever reaches CI.
      - name: Verify SPM paths are portable
        run: |
          if grep -qF '\' ios/App/CapApp-SPM/Package.swift; then
            echo "::error::Package.swift contains Windows path separators. Run 'npm run cap:fix:spm' and commit the result."
            grep -nF '\' ios/App/CapApp-SPM/Package.swift | head -5
            exit 1
          fi
          echo "SPM paths OK (forward slashes)"

      # Fails loudly if a Capacitor plugin is declared in frontend/package.json but
      # not in the root package.json next to capacitor.config.json.
      - name: Verify native plugins were linked
        run: |
          PLUGIN_COUNT=$(grep -c 'CapacitorPlugin\|\.package(name:' ios/App/CapApp-SPM/Package.swift || true)
          echo "Package.swift plugin references: $PLUGIN_COUNT"
          if [ "$PLUGIN_COUNT" -lt 2 ]; then
            echo "::error::Capacitor sync linked no plugins into the iOS project."
            exit 1
          fi

      # `xcodebuild -scheme App` needs a SHARED scheme. Xcode autocreates schemes
      # into xcuserdata/ (gitignored), so a project can build on a developer Mac
      # while a fresh CI checkout has no scheme at all — which xcodebuild reports
      # as a bare exit 70. Fail here with something readable instead.
      - name: Verify shared scheme exists
        run: |
          if [ ! -f ios/App/App.xcodeproj/xcshareddata/xcschemes/App.xcscheme ]; then
            echo "::error::No shared App scheme. In Xcode: Product > Scheme > Manage Schemes, tick Shared, and commit App.xcodeproj/xcshareddata/."
            exit 1
          fi
          echo "Shared scheme present"

      # Records what the environment actually resolved to. `xcodebuild` exiting 65
      # says only "a build error occurred"; without these there is no way to tell a
      # toolchain mismatch from a source error.
      - name: Environment diagnostics
        run: |
          echo "--- xcode ---";   xcodebuild -version
          echo "--- ios sdks ---"; xcodebuild -showsdks | grep -i ios || true
          echo "--- schemes ---"; xcodebuild -list -project App.xcodeproj || true
        working-directory: ios/App

      # `-sdk iphoneos`, NOT `-destination 'generic/platform=iOS'`.
      #
      # The destination form makes xcodebuild resolve a concrete device
      # platform, which fails on a runner whose iOS platform bundle is absent:
      #   error: Unable to find a destination matching the provided destination
      #   specifier ... iOS 18.2 is not installed
      # Selecting the SDK directly is what a generic unsigned device build
      # actually needs and skips destination resolution entirely.
      - name: Build for physical iOS device (Unsigned Release)
        env:
          # CFBundleVersion must be unique per upload; App Store Connect
          # rejects duplicates. Mirrors ANDROID_VERSION_CODE in
          # build-android-aab.yml.
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            KANAKU_BUILD_NUMBER=$BUILD_NUMBER \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build 2>&1 | tee xcodebuild.log
        working-directory: ios/App

      # An exit-65 run otherwise leaves nothing to inspect. The log is the only
      # way to identify the actual compile error.
      - name: Upload xcodebuild log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-log
          path: ios/App/xcodebuild.log
          if-no-files-found: warn
          retention-days: 14

      - name: Package into unsigned .ipa
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -ry Kanaku-unsigned.ipa Payload
        working-directory: ios/App

      - name: Upload iOS .ipa artifact
        uses: actions/upload-artifact@v7
        with:
          name: Kanaku-unsigned-ipa
          path: ios/App/Kanaku-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        if: always()
        run: |
          echo "## iOS Build Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f "ios/App/Kanaku-unsigned.ipa" ]; then
            echo "- Physical iOS Build (.ipa): ✅ succeeded" >> $GITHUB_STEP_SUMMARY
            echo "- Artifact: \`Kanaku-unsigned.ipa\` is ready for download & sideloading via Sideloadly / AltStore" >> $GITHUB_STEP_SUMMARY
            echo "- ⚠️ Note on Push Notifications: Sideloaded free Apple ID builds cannot receive APNs pushes (\`aps-environment\` requires a paid Apple Developer Program account + TestFlight/App Store signing)." >> $GITHUB_STEP_SUMMARY
          else
            echo "- Physical iOS Build (.ipa): ❌ failed" >> $GITHUB_STEP_SUMMARY
            # Put the actual error in the summary. Previously the only signal was
            # "exit code 70", and diagnosing it meant downloading an artifact.
            if [ -f ios/App/xcodebuild.log ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "<details><summary>First errors from xcodebuild</summary>" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              grep -E "error:|error CS|xcodebuild: error|Could not resolve|does not contain a scheme|fatal error" ios/App/xcodebuild.log | head -25 >> $GITHUB_STEP_SUMMARY || true
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "</details>" >> $GITHUB_STEP_SUMMARY
              # A destination/SDK error is only actionable alongside what the
              # toolchain actually offers, so record that too.
              echo "<details><summary>Toolchain</summary>" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              xcodebuild -version >> $GITHUB_STEP_SUMMARY 2>&1 || true
              xcodebuild -showsdks 2>/dev/null | grep -i ios >> $GITHUB_STEP_SUMMARY || echo "(no iOS SDKs reported)" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "</details>" >> $GITHUB_STEP_SUMMARY
            fi
          fi
