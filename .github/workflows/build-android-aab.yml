name: Build Android AAB (Release)
#
# Signing secrets are referenced DIRECTLY (`secrets.NAME`), not via
# `toJSON(secrets)`.
#
# The old indirection existed so the linter would not flag references to
# possibly-undefined optional secrets — but the release build now REQUIRES them
# and fails without them, so there is nothing optional left to work around.
# Passing the whole secrets object into an env var handed every repository
# secret to the build step regardless of what it needed (CodeQL: "Excessive
# Secrets Exposure").

on:
  push:
    branches: [main]
    paths:
      - "frontend/src/**"
      - "frontend/public/**"
      - "android/**"
      - "frontend/package.json"
      - "package-lock.json"
      - "capacitor.config.*"
      - ".github/workflows/build-android-aab.yml"
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'Build variant (debug or release)'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release

env:
  NODE_VERSION: '22'
  # Capacitor 8 plugin modules declare kotlin { jvmToolchain(21) }; building them
  # on JDK 17 fails to resolve a toolchain.
  JAVA_VERSION: '21'


# Least-privilege token. Without an explicit block a workflow inherits the
# repository default, which can be read/write on every scope — far more than a
# build job needs (CodeQL: "Workflow does not contain permissions").
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # Every run recompiled all Capacitor plugin modules from scratch.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties', 'package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install Android SDK packages
        run: |
          # `|| true` used to hide a failed install here; the build then died much
          # later inside Gradle with an unrelated-looking error. Licences may
          # legitimately be pre-accepted, so only that line tolerates failure.
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Make gradlew executable
        run: chmod +x gradlew
        working-directory: android

      # Workspace-aware install at the repo root installs both workspaces (incl. frontend).
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: .

      - name: Build frontend for Capacitor
        run: npm run build
        working-directory: frontend

      - name: Run Capacitor sync
        run: npx cap sync android
        working-directory: .

      # A release artifact is only meaningful if it carries the REAL upload key.
      #
      # This step used to generate a throwaway self-signed keystore when the
      # secrets were absent, build a release AAB with it, and upload it under the
      # same artifact name as a genuine one — a different random key on every run.
      # Uploading such a build to Play fails the signature check, and on a first
      # upload it would have permanently bound the wrong signing key to the
      # package name. Missing production secrets now fail the job.
      - name: Decode upload keystore
        if: |
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.build_variant == 'release')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. A release build cannot be signed with the upload key."
            echo "::error::Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_PASSWORD under Settings → Secrets and variables → Actions."
            echo "::error::To produce an unsigned build for local testing, run the workflow manually with build_variant=debug."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/finance-life-release.keystore
          # Guard against a truncated or mis-encoded secret producing a file that
          # only fails much later, inside Gradle.
          if [ ! -s android/finance-life-release.keystore ]; then
            echo "::error::Decoded keystore is empty — ANDROID_KEYSTORE_BASE64 is not valid base64."
            exit 1
          fi

      # The app has a `smsSupport` flavor dimension (full | nosms), so Gradle emits
      # per-flavor artifacts under outputs/bundle/<flavor>Release/ — there is no
      # plain app-release.aab. `bundleRelease`/`assembleDebug` are the aggregate
      # lifecycle tasks and build both flavors.
      - name: Build APK (Debug)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_variant == 'debug'
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Build AAB (Release)
        if: |
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.build_variant == 'release')
        env:
          KEYSTORE_PATH: finance-life-release.keystore
          KEY_ALIAS: finance-life
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Monotonic per-run offset added to VERSION_CODE_BASE in app/build.gradle.
          # github.run_number only ever increases for a given workflow, so version
          # codes stay strictly ascending across builds.
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          cd android
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_PASSWORD are not set — refusing to build an incorrectly signed release."
            exit 1
          fi
          printf 'storeFile=../%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PATH" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > key.properties
          # ANDROID_VERSION_CODE is consumed by app/build.gradle so every CI build
          # gets a unique, monotonically increasing code (Play rejects duplicates).
          ./gradlew bundleRelease --no-daemon
          rm -f key.properties

      - name: Upload Debug APK artifacts
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_variant == 'debug'
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: android/app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      # nosms is the Play Store upload (no SMS permissions — see
      # android/app/src/nosms/AndroidManifest.xml).
      - name: Upload Play Store AAB (nosms)
        if: |
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.build_variant == 'release')
        uses: actions/upload-artifact@v7
        with:
          name: app-nosms-release-aab
          path: android/app/build/outputs/bundle/nosmsRelease/*.aab
          if-no-files-found: error
          retention-days: 30

      # full is the sideload / direct-download build that keeps SMS auto-detection.
      - name: Upload Sideload AAB (full)
        if: |
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.build_variant == 'release')
        uses: actions/upload-artifact@v4
        with:
          name: app-full-release-aab
          path: android/app/build/outputs/bundle/fullRelease/*.aab
          if-no-files-found: error
          retention-days: 30

      # R8 mapping files — required to symbolicate Play Console crash reports.
      - name: Upload ProGuard mapping files
        if: |
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.build_variant == 'release')
        uses: actions/upload-artifact@v4
        with:
          name: proguard-mappings
          path: android/app/build/outputs/mapping/*/mapping.txt
          # Play Console crash reports keep arriving long after release. At the
          # previous 30 days the mapping expired with the AAB, leaving those stack
          # traces permanently unsymbolicatable. 90 is the artifact maximum.
          if-no-files-found: error
          retention-days: 90

      - name: Clean up keystore
        if: always()
        run: rm -f android/finance-life-release.keystore android/key.properties

      - name: Build summary
        if: always()
        # Branch/event names go through env, not direct ${{ }} interpolation in
        # the shell (CodeQL: expression/script injection in GitHub Actions).
        env:
          BRANCH: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: $BRANCH" >> $GITHUB_STEP_SUMMARY
          echo "- Triggered by: $EVENT" >> $GITHUB_STEP_SUMMARY
          for apk in android/app/build/outputs/apk/*/debug/*.apk; do
            [ -f "$apk" ] && echo "- Debug APK: ✅ $(basename "$apk")" >> $GITHUB_STEP_SUMMARY
          done
          for aab in android/app/build/outputs/bundle/*/*.aab; do
            [ -f "$aab" ] && echo "- Release AAB: ✅ $(basename "$aab")" >> $GITHUB_STEP_SUMMARY
          done
