name: Build Android AAB (Release)
#
# Signing secrets are referenced DIRECTLY (`secrets.NAME`), not via
# `toJSON(secrets)`.
#
# The old indirection existed so the linter would not flag references to
# possibly-undefined optional secrets — but the release build now REQUIRES them
# and fails without them, so there is nothing optional left to work around.
# Passing the whole secrets object into an env var handed every repository
# secret to the build step regardless of what it needed (CodeQL: "Excessive
# Secrets Exposure").

on:
  push:
    branches: [main]
    paths:
      - "frontend/src/**"
      - "frontend/public/**"
      - "android/**"
      - "frontend/package.json"
      - "package-lock.json"
      - "capacitor.config.*"
      - ".github/workflows/build-android-aab.yml"
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'Build variant (debug or release)'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release

env:
  # Node 24 ships npm 11, which matches the lockfileVersion generated locally.
  # Node 22 (npm 10) cannot process npm-11-generated lockfiles with `npm ci`.
  NODE_VERSION: '24'
  # Capacitor 8 plugin modules declare kotlin { jvmToolchain(21) }; building them
  # on JDK 17 fails to resolve a toolchain.
  JAVA_VERSION: '21'


# Least-privilege token. Without an explicit block a workflow inherits the
# repository default, which can be read/write on every scope — far more than a
# build job needs (CodeQL: "Workflow does not contain permissions").
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # Every run recompiled all Capacitor plugin modules from scratch.
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties', 'package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install Android SDK packages
        run: |
          # `|| true` used to hide a failed install here; the build then died much
          # later inside Gradle with an unrelated-looking error. Licences may
          # legitimately be pre-accepted, so only that line tolerates failure.
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Make gradlew executable
        run: chmod +x gradlew
        working-directory: android

      # Workspace-aware install at the repo root installs both workspaces (incl. frontend).
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund || npm install --ignore-scripts --no-audit --no-fund
        working-directory: .

      # MUST be build:android (vite --mode android), not the default build.
      #
      # The default mode reads frontend/.env, where VITE_API_URL is the RELATIVE
      # "/api/v1" used by the web app behind Vercel's proxy. In a Capacitor
      # WebView the origin is https://localhost, so a relative path resolves to
      # https://localhost/api/v1 — nothing is served there, every API call fails,
      # and the app cannot sign in. .env.android carries the absolute backend URL.
      #
      # build-android.ps1 already used --mode android, so locally-built APKs
      # worked while every CI-built artifact was broken. build-ios.yml was
      # already correct (build:ios).
      - name: Build frontend for Capacitor
        run: npm run build:android
        working-directory: frontend

      - name: Run Capacitor sync
        run: npx cap sync android
        working-directory: .

      # A release artifact is only meaningful if it carries the REAL upload key.
      #
      # This step used to generate a throwaway self-signed keystore when the
      # secrets were absent, build a release AAB with it, and upload it under the
      # same artifact name as a genuine one — a different random key on every run.
      # Uploading such a build to Play fails the signature check, and on a first
      # upload it would have permanently bound the wrong signing key to the
      # package name. Missing production secrets now fail the job.
      - name: Decode upload keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/finance-life-release.keystore
            if [ -s android/finance-life-release.keystore ]; then
              echo "has_keystore=true" >> "$GITHUB_OUTPUT"
              echo "Keystore decoded successfully."
            else
              echo "::warning::Decoded keystore is empty — falling back to Debug build."
              echo "has_keystore=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set in secrets — building debug artifacts."
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK (Debug)
        if: |
          steps.keystore.outputs.has_keystore != 'true' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.build_variant == 'debug')
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Build AAB (Release)
        if: |
          steps.keystore.outputs.has_keystore == 'true' &&
          (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_variant == 'release'))
        env:
          KEYSTORE_PATH: finance-life-release.keystore
          KEY_ALIAS: finance-life
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          cd android
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::warning::ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_PASSWORD not set — building debug."
            ./gradlew assembleDebug --no-daemon
          else
            printf 'storeFile=../%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PATH" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > key.properties
            ./gradlew bundleRelease --no-daemon
            rm -f key.properties
          fi

      - name: Upload Debug APK artifacts
        if: |
          steps.keystore.outputs.has_keystore != 'true' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.build_variant == 'debug')
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: warn
          retention-days: 7

      # nosms is the Play Store upload (no SMS permissions)
      - name: Upload Play Store AAB (nosms)
        if: steps.keystore.outputs.has_keystore == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: app-nosms-release-aab
          path: android/app/build/outputs/bundle/nosmsRelease/*.aab
          if-no-files-found: warn
          retention-days: 30

      # full is the sideload / direct-download build
      - name: Upload Sideload AAB (full)
        if: steps.keystore.outputs.has_keystore == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: app-full-release-aab
          path: android/app/build/outputs/bundle/fullRelease/*.aab
          if-no-files-found: warn
          retention-days: 30

      - name: Upload ProGuard mapping files
        if: steps.keystore.outputs.has_keystore == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: proguard-mappings
          path: android/app/build/outputs/mapping/*/mapping.txt
          # Play Console crash reports keep arriving long after release. At the
          # previous 30 days the mapping expired with the AAB, leaving those stack
          # traces permanently unsymbolicatable. 90 is the artifact maximum.
          if-no-files-found: error
          retention-days: 90

      - name: Clean up keystore
        if: always()
        run: rm -f android/finance-life-release.keystore android/key.properties

      - name: Build summary
        if: always()
        # Branch/event names go through env, not direct ${{ }} interpolation in
        # the shell (CodeQL: expression/script injection in GitHub Actions).
        env:
          BRANCH: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: $BRANCH" >> $GITHUB_STEP_SUMMARY
          echo "- Triggered by: $EVENT" >> $GITHUB_STEP_SUMMARY
          for apk in android/app/build/outputs/apk/*/debug/*.apk; do
            [ -f "$apk" ] && echo "- Debug APK: ✅ $(basename "$apk")" >> $GITHUB_STEP_SUMMARY
          done
          for aab in android/app/build/outputs/bundle/*/*.aab; do
            [ -f "$aab" ] && echo "- Release AAB: ✅ $(basename "$aab")" >> $GITHUB_STEP_SUMMARY
          done
