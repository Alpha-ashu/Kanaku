name: CI — Lint, Type-check & Test
# Env values below are literal CI fixtures (local Postgres service + stubbed Supabase),
# not GitHub secrets. Do not wrap them in ${{ secrets.* }} — undefined secrets produce
# false "Context access might be invalid" lint warnings.

# Environment branches (docs/release/ENVIRONMENTS.md): dev → staging → main.
# Every push to, and every PR into, any of them is gated by this workflow.
on:
  push:
    branches: [main, staging, dev]
  pull_request:
    branches: [main, staging, dev]

# Minimal token scope: these jobs only read the repo (checkout) and talk to a
# local Postgres service — no write access is needed.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Change detection ────────────────────────────────────────────────────────
  # Only spend runner minutes on the area that actually changed. Doc-only commits
  # match neither filter, so both heavy jobs skip. Job-level `if:` skips are
  # treated as PASSED for required status checks, so this never blocks a PR.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'

  # ─── Backend ───────────────────────────────────────────────────────────────
  backend:
    name: Backend (Node.js / Jest)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kanaku_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      # Workspace-aware install at the repo root (single hoisted lockfile).
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund || npm install --ignore-scripts --no-audit --no-fund

      - name: Generate Prisma client
        working-directory: backend
        run: |
          set -x
          mkdir -p generated/prisma/runtime
          node ../node_modules/prisma/build/index.js generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kanaku_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/kanaku_test

      - name: Push schema to test DB
        working-directory: backend
        run: node ../node_modules/prisma/build/index.js db push --accept-data-loss
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kanaku_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/kanaku_test

      # Replays the migration history into a shadow DB and diffs it against
      # schema.prisma.
      #
      # Until 2026-09-16 this step never actually compared anything: Prisma 7
      # removed --shadow-database-url / --to-schema-datamodel, so it died on
      # argument parsing and — being before type-check — skipped every later
      # backend step on every run since it was added (08-15). Fixed here:
      #   - shadow URL comes from SHADOW_DATABASE_URL via prisma.config.js,
      #   - the shadow DB is created (the service only creates kanaku_test),
      #   - prisma/ci/supabase-compat.sql provides the Supabase roles/auth.uid()
      #     the RLS migrations need on plain Postgres.
      #
      # ADVISORY for now (continue-on-error): with replay working, it reports real
      # drift — migrations still differ from schema.prisma in ways that need an
      # owner decision before a reconcile migration can ship (legacy todo_* tables
      # would be dropped; clientRequestId unique indexes change scope). See
      # docs/release/ENVIRONMENTS.md → "Schema drift". Remove continue-on-error
      # once `migrate diff --exit-code` returns 0.
      - name: Guard schema drift against migrations
        id: drift
        continue-on-error: true
        working-directory: backend
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE kanaku_shadow'
          PGPASSWORD=postgres psql -h localhost -U postgres -d kanaku_shadow -v ON_ERROR_STOP=1 -q -f prisma/ci/supabase-compat.sql
          set +e
          node ../node_modules/prisma/build/index.js migrate diff --from-migrations ./prisma/migrations --to-schema ./prisma/schema.prisma --exit-code > drift.txt 2>&1
          status=$?
          set -e
          cat drift.txt
          {
            echo "### Schema drift (migrations → schema.prisma)"
            echo '```'
            cat drift.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -eq 2 ]; then
            echo "::warning title=Schema drift::Migration history does not reproduce schema.prisma — see the job summary."
          fi
          exit "$status"
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kanaku_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/kanaku_test
          SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kanaku_shadow

      - name: Type-check
        working-directory: backend
        run: npx tsc --noEmit --skipLibCheck
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kanaku_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/kanaku_test

      - name: Lint
        working-directory: backend
        # Uses the ratchet baked into the package script (--max-warnings 577),
        # not --max-warnings 0. The override demanded zero warnings against 577
        # pre-existing ones, so the gate could only ever be satisfied by the
        # `|| true` that made it meaningless. The ratchet fails on any NEW
        # warning, which is a real gate today; lower the number as debt is paid.
        run: npm run lint

      - name: Run unit tests
        working-directory: backend
        run: npx jest --ci --forceExit --testPathIgnorePatterns="tests/integration"
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kanaku_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/kanaku_test
          JWT_SECRET: ci-test-secret-at-least-32-characters-long
          SUPABASE_URL: http://localhost:54321
          SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_SERVICE_KEY: test-service-key
          SUPABASE_JWT_SECRET: test-jwt-secret
          FRONTEND_URL: http://localhost:9002

      - name: Run integration tests
        working-directory: backend
        run: npx jest --ci --forceExit --runInBand "../quality/backend/tests/integration"
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kanaku_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/kanaku_test
          JWT_SECRET: ci-test-secret-at-least-32-characters-long
          SUPABASE_URL: http://localhost:54321
          SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_SERVICE_KEY: test-service-key
          SUPABASE_JWT_SECRET: test-jwt-secret
          FRONTEND_URL: http://localhost:9002

  # ─── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Vite / Vitest)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      # Workspace-aware install at the repo root (single hoisted lockfile).
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund || npm install --ignore-scripts --no-audit --no-fund

      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit --skipLibCheck

      - name: Lint
        working-directory: frontend
        # Same ratchet reasoning as the backend job (--max-warnings 1250). Also
        # drops the bespoke glob: ESLint resolves "src/**/*.{ts,tsx}" itself and
        # the brace pattern fails outright on some platforms, so the package
        # script's plain `eslint .` is the more portable invocation.
        run: npm run lint

      - name: Run unit tests
        working-directory: frontend
        run: npx vitest run --reporter=verbose
        env:
          NODE_ENV: test
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_ANON_KEY: test-anon-key
          VITE_API_URL: /api/v1
