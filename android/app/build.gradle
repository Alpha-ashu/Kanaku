apply plugin: 'com.android.application'

// Load signing properties from key.properties if present (used by the e2e build script)
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
def hasSigningProperties = keystorePropertiesFile.exists()
if (hasSigningProperties) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Single source of truth for the app's version. Bump VERSION_CODE_BASE when you
// cut a release; CI adds its run number on top so no two builds collide.
def VERSION_CODE_BASE = 12
def VERSION_NAME = "1.0.4"

android {
    namespace = "com.kanaku.app"
    compileSdk = rootProject.ext.compileSdkVersion
    flavorDimensions "smsSupport"
    productFlavors {
        full {
            dimension "smsSupport"
            applicationIdSuffix ".full"
            versionNameSuffix "-full"
            manifestPlaceholders = [
                smsReceiverEnabled: "true"
            ]
        }
        nosms {
            dimension "smsSupport"
            // No applicationIdSuffix so package name is exactly com.kanaku.app for Google Play Store
            manifestPlaceholders = [
                smsReceiverEnabled: "false"
            ]
        }
    }
    // Matches the generated app/capacitor.build.gradle (applied at the bottom of
    // this file, so it wins anyway) and the Capacitor 8 plugin modules, which
    // compile at 21 and use kotlin { jvmToolchain(21) }. Requires JDK 21.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    defaultConfig {
        applicationId "com.kanaku.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionCode was hardcoded, so CI produced a release AAB stamped `10` on
        // every push to main — Play rejects a duplicate version code, meaning no
        // artifact the pipeline built was actually uploadable without hand-editing
        // this file first.
        //
        // ANDROID_VERSION_CODE (set by CI from the run number) now offsets the
        // floor below. Local builds without the env var keep using the floor, so
        // nothing changes for a developer building on their own machine.
        versionCode VERSION_CODE_BASE + (System.getenv("ANDROID_VERSION_CODE") ?: "0").toInteger()
        versionName VERSION_NAME
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Add signing configuration that reads from key.properties when present
    signingConfigs {
        release {
            if (hasSigningProperties) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            // Use the optimized default proguard file (avoids legacy warning)
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Keep debug builds independent from signing; release only signs when key.properties exists.
            if (hasSigningProperties) {
                signingConfig signingConfigs.release
            }
        }
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    def releaseRequested = taskGraph.allTasks.any { task ->
        task.name.toLowerCase().contains('release') &&
            (task.name.toLowerCase().startsWith('bundle') || task.name.toLowerCase().startsWith('assemble'))
    }
    if (releaseRequested && !hasSigningProperties) {
        throw new RuntimeException(
            "Missing android/key.properties for release signing. Copy android/key.properties.example to android/key.properties and set secure values."
        )
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// ── Firebase Cloud Messaging config ──────────────────────────────────────────
//
// google-services.json is gitignored (it is per-project config, supplied by
// whoever builds), so it is legitimately absent on a fresh clone. What is NOT
// acceptable is shipping a RELEASE artifact without it: the google-services
// plugin never runs, no Firebase resources are generated, PushNotifications
// .register() fails on device, and the only trace was a logger.info() that
// nobody sees — so a store build silently lost push notifications.
//
// Debug builds warn. Release builds fail, mirroring the existing key.properties
// guard below/above. Override deliberately with:
//     ./gradlew bundleNosmsRelease -PallowMissingGoogleServices=true
def googleServicesFile = file('google-services.json')
def hasGoogleServices = googleServicesFile.exists() && googleServicesFile.length() > 0

if (hasGoogleServices) {
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.warn("WARNING: android/app/google-services.json is missing — Firebase is not configured and push notifications WILL NOT work in this build.")
}

gradle.taskGraph.whenReady { taskGraph ->
    def releaseRequested = taskGraph.allTasks.any { task ->
        task.name.toLowerCase().contains('release') &&
            (task.name.toLowerCase().startsWith('bundle') || task.name.toLowerCase().startsWith('assemble'))
    }
    def allowMissing = project.hasProperty('allowMissingGoogleServices') &&
        project.property('allowMissingGoogleServices').toString().toBoolean()

    if (releaseRequested && !hasGoogleServices && !allowMissing) {
        throw new RuntimeException(
            "Missing android/app/google-services.json — a release build would ship with push notifications " +
            "silently broken. Download it from the Firebase console (Project settings → Your apps → Android), " +
            "or pass -PallowMissingGoogleServices=true to build without push on purpose."
        )
    }
}
